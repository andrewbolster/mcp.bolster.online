name: Automated Release

# Delegates to bolster's release-logic.yml rather than keeping a second,
# hand-duplicated copy in step with it — this repo's copy had the exact same
# bug bolster's did: release PRs are opened with GITHUB_TOKEN, so
# automerge.yml's pull_request_target trigger never fires for them, and every
# release PR needed a manual merge. release-logic.yml now merges patch bumps
# directly instead of relying on that trigger.
#
# Neither published to PyPI nor documented at a standalone URL, so
# package_name/docs_url/pypi_base_url stay blank — release-logic.yml omits
# those PR body sections when they're empty rather than printing a misleading
# `pip install` line for a package that isn't there.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type (patch, minor, major)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions: read-all

jobs:
  release:
    uses: andrewbolster/bolster/.github/workflows/release-logic.yml@main
    with:
      version_bump: ${{ inputs.version_bump || 'auto' }}
      block_minor: true
      package_name: ""
      docs_url: ""
      pypi_base_url: ""
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
