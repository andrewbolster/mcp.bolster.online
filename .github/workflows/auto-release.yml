name: Automated Release

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            version_bump:
                description: "Version bump type (patch, minor, major)"
                required: false
                default: "auto"
                type: choice
                options:
                    - auto
                    - patch
                    - minor
                    - major

permissions:
    contents: write
    pull-requests: write

jobs:
    release:
        uses: andrewbolster/bolster/.github/workflows/release-logic.yml@main
        with:
            version_bump: ${{ inputs.version_bump || 'auto' }}
            block_minor: false
            package_name: mcp-bolster-online
        permissions:
            contents: write
            pull-requests: write
