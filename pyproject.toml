[project]
name = "mcp-bolster-online"
version = "0.2.0"
description = "MCP server providing curated resources and tools about Andrew Bolster — professional background, research interests, community involvement, and availability tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0" }
authors = [{ name = "Andrew Bolster", email = "andrew@bolster.online" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "bolster>=0.6.0",
    "defusedxml>=0.7.1",
    "fastmcp>=3.3.1",
    "httpx>=0.28.1",
    "uvicorn>=0.34.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.coverage.run]
relative_files = true

[tool.bumpversion]
current_version = "0.2.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = false
sign_tags = true
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = true
commit = false
message = "Bump version: {current_version} → {new_version}"

[dependency-groups]
dev = [
    "ruff==0.16.5",
    "mypy==2.3.1",
    "pre-commit>=4.2.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "bump-my-version>=0.15.4",
    "httpx>=0.28.1",
]

[tool.ruff]
# Matches the shared baseline (bolster, bolster.help): 120 rather than 88.
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E,F,I,W,UP,B,C4,SIM are the shared core across bolster/mcp.bolster.online;
# N (pep8-naming) was already selected here and stays as this repo's own
# addition on top, same as bolster keeps its own extra categories.
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # Allow long lines in strings/docstrings

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
