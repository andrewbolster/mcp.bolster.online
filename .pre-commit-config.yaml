repos:
  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.13
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-ruff
        exclude: ^deployment/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Kept in exact sync with the ruff dev dependency in pyproject.toml, so
    # `uv run ruff`, this hook, and CI's `pre-commit run --all-files` are
    # provably the same binary.
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        additional_dependencies: [types-requests]
        args: [--ignore-missing-imports]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-byte-order-marker
      - id: debug-statements
      - id: detect-private-key

  - repo: local
    hooks:
      - id: no-webhook-secret
        name: webhook.json must contain WEBHOOK_SECRET placeholder
        entry: grep -q WEBHOOK_SECRET deployment/webhook.json
        language: system
        files: deployment/webhook\.json
        pass_filenames: false

  # Security scanning hooks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: [-r]
        exclude: ^(test_|tests/)
